name: final/translator/C2C_m2_167_add3_emb
root_dir: "dataset/OPV2V/train"
validate_dir: "dataset/OPV2V/validate"
test_dir: "dataset/OPV2V/test"

train_params:
  batch_size: &batch_size 1
  epoches: 20
  eval_freq: 1
  save_freq: 5
  max_cav: 5

comm_range: 70
yaml_parser: "load_general_params_heter_group"
input_source: ['lidar', 'camera', 'depth']
label_type: 'lidar'
add_data_extension: ['bev_visibility.png']

cav_lidar_range: &cav_lidar [-102.4, -102.4, -3, 102.4, 102.4, 1]

heter:
  assignment_path: "opencood/modality_assign/opv2v_4modality.json"
  definition_path: "opencood/modality_assign/10modality_define_codebook16.yaml"
  # ego group, only ego group data
  ego_modality: &ego_modality ['m2']
  heter_group: [['m2']]

  lidar_channels_dict:
    m4: 32
  mapping_dict:
    m1: m1
    m2: m2
    m3: m3
    m4: m4
    m5: m5
    m6: m6
    m7: m7
    m8: m8
    m9: m9
  # modality_setting: 

fusion:
  core_method: 'intermediateheter'
  dataset: 'opv2v'
  args: 
    proj_first: false
    grid_conf: None # place-holder
    data_aug_conf: None # place-holder

preprocess:
  # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4] # useful
    max_points_per_voxel: 1 # useless
    max_voxel_train: 1 # useless
    max_voxel_test: 1 # useless
  # lidar range for each individual cav.
  cav_lidar_range: *cav_lidar

# anchor box related
postprocess:
  core_method: 'VoxelPostprocessor' # VoxelPostprocessor, BevPostprocessor supported
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: &anchor_yaw [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: 'hwl' # hwl or lwh
  max_num: &max_num 150 # maximum number of objects in a single frame. use this number to make sure different frames has the same dimension in the same batch
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw
  cav_lidar_range: *cav_lidar
  voxel_size: *voxel_size

# model related
model:
  core_method: heter_codebook_shared_head_c2c
  args:
    lidar_range: *cav_lidar
    anchor_number: *anchor_num
    dir_args: *dir_args
    ego_modality: *ego_modality
    voxel_size: *voxel_size
    out_size_factor: &out_size_factor 2
    
    only_train_translator: false
    supervise_single: true
    
    only_train_embedding: true
    translator_path: '/GPFS/data/changxingliu/HEAL/opencood/logs/final/translator/C2C_m2_m167_gate_balance_2025_09_22_21_04_19/net_epoch_bestval_at20.pth'

    # ego group, aligner + codebook
    use_coded_feature: false
    use_codemap: false
    use_d2d: false
    # aligner_modality: *ego_modality
    # aligner:
    #   core_method: 'resnet3x3'
    #   args:
    #     dim: 64
    #     num_of_blocks: 4
    # ego_codebook:
    #   seg_num: 1
    #   dict_size: 16
    #   r: 1
    # ego_group_model: '/GPFS/data/changxingliu/HEAL/opencood/logs/homo_codebook/m2_16/net_epoch_bestval_at29.pth'

    # other group, codebook+fusion+head
    backend_modality: &backend_modality ['m3']
    backend: 
      m1: '/GPFS/data/changxingliu/HEAL/opencood/logs/homo_codebook/m1_16/net_epoch_bestval_at33.pth'
      m2: '/GPFS/data/changxingliu/HEAL/opencood/logs/homo_codebook/m2_16/net_epoch_bestval_at29.pth'
      m3: '/GPFS/data/changxingliu/HEAL/opencood/logs/homo_codebook/m3_16/net_epoch_bestval_at33.pth'
      m6: '/GPFS/data/changxingliu/HEAL/opencood/logs/homo_codebook/m6_16/net_epoch_bestval_at28.pth'
      m7: '/GPFS/data/changxingliu/HEAL/opencood/logs/homo_codebook/m7_16/net_epoch_bestval_at27.pth'

    codebook:
      seg_num: 1
      dict_size: 16
      r: 1

    translator:
      core_method: convnext_emb_gate # convnext_film, convnext, convnext_emb_cat, convnext_emb_mlp_cat, convnext_with_modal_heads, convnext_emb_gate, convnext_emb_gate_multilayer
      args:
        in_channels: 64
        out_channels: 16
        in_cav_lidar_range: *cav_lidar
        out_cav_lidar_range: *cav_lidar
        in_feature_shape: [256, 256]
        out_feature_shape: [256, 256]
        submodule_args:
          num_of_blocks: 3
          dim: 64
          embedding_dim: 64
          modality_map: *backend_modality

    fusion: 
      method: 'pyramidfusion'
      backbone: 
        resnext: true
        layer_nums: [3, 5, 8]
        layer_strides: [1, 2, 2]
        num_filters: [64, 128, 256]
        upsample_strides: [1, 2, 4]
        num_upsample_filter: [128, 128, 128]
        anchor_number: *anchor_num
      shrink_head: 
        kernal_size: [ 3 ]
        stride: [ 1 ]
        padding: [ 1 ]
        dim: [ 256 ]
        input_dim: 384 # 128 * 3

    in_head: 256
    in_head_single: 64

loss:
  core_method: point_pillar_pyramid_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: 'SigmoidFocalLoss'
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: 'WeightedSmoothL1Loss'
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: 'WeightedSoftmaxClassificationLoss'
      weight: 0.2
      args: *dir_args
    depth:
      weight: 1.0
    pyramid:
      relative_downsample: [1, 2, 4]
      weight: [0.4, 0.2, 0.1]

optimizer:
  core_method: Adam
  lr: 0.005
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep #step, multistep and Exponential support
  gamma: 0.1
  step_size: [5,10]
