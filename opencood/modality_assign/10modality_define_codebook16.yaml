cav_lidar_range: &cav_lidar [-102.4, -102.4, -3, 102.4, 102.4, 1]
anchor_num: &anchor_num 2

heter:
  modality_setting:
    m1:
      sensor_type: &sensor_type_m1 'lidar'
      core_method: &core_method_m1 "point_pillar"
      # lidar requires preprocess
      preprocess:
        # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size_m1 [0.4, 0.4, 4]
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        # lidar range for each individual cav.
        cav_lidar_range: *cav_lidar
    m2:
      sensor_type: &sensor_type_m2 'lidar'
      core_method: &core_method_m2 "second"

      # lidar requires preprocess
      preprocess:
        # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size_m2 [0.1, 0.1, 0.1]
          max_points_per_voxel: 5
          max_voxel_train: 32000
          max_voxel_test: 70000
        # lidar range for each individual cav.
        cav_lidar_range: *cav_lidar
    m3:
      sensor_type: &sensor_type_m3 'lidar'
      core_method: &core_method_m3 "VoxelNet"

      # lidar requires preprocess
      preprocess:
        # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size_m3 [0.4, 0.4, 4]
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        # lidar range for each individual cav.
        cav_lidar_range: *cav_lidar

    m4:
      sensor_type: &sensor_type_m4 'lidar'
      core_method: &core_method_m4 "point_pillar"
      # lidar requires preprocess
      preprocess:
        # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size_m4 [0.4, 0.4, 4]
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        # lidar range for each individual cav.
        cav_lidar_range: *cav_lidar
    m5:
      sensor_type: &sensor_type_m5 'lidar'
      core_method: &core_method_m5 "point_pillar"
      # lidar requires preprocess
      preprocess:
        # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size_m5 [0.3, 0.3, 4]
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        # lidar range for each individual cav.
        cav_lidar_range: *cav_lidar
    m6:
      sensor_type: &sensor_type_m6 'camera'
      core_method: &core_method_m6 "lift_splat_shoot"

      grid_conf: &grid_conf_m6
        xbound: [-51.2, 51.2, 0.4]   # 限制x方向的范围并划分网格
        ybound: [-51.2, 51.2, 0.4]   # 限制y方向的范围并划分网格
        zbound: [-10, 10, 20.0]   # 限制z方向的范围并划分网格
        ddiscr: [2, 50, 48]
        mode: 'LID'
      data_aug_conf: &data_aug_conf_m6
        resize_lim: [0.56, 0.61]
        final_dim: [336, 448]
        rot_lim: [-3.6, 3.6]
        H: 600
        W: 800
        rand_flip: False
        bot_pct_lim: [0.0, 0.05]
        cams: ['camera0', 'camera1', 'camera2', 'camera3']
        Ncams: 4
    m7:
      sensor_type: &sensor_type_m7 'camera'
      core_method: &core_method_m7 "lift_splat_shoot"

      grid_conf: &grid_conf_m7
        xbound: [-51.2, 51.2, 0.4]   # 限制x方向的范围并划分网格
        ybound: [-51.2, 51.2, 0.4]   # 限制y方向的范围并划分网格
        zbound: [-10, 10, 20.0]   # 限制z方向的范围并划分网格
        ddiscr: [2, 50, 48]
        mode: 'LID'
      data_aug_conf: &data_aug_conf_m7
        resize_lim: [0.65, 0.7]
        final_dim: [384, 512]
        rot_lim: [-3.6, 3.6]
        H: 600
        W: 800
        rand_flip: False
        bot_pct_lim: [0.0, 0.05]
        cams: ['camera0', 'camera1', 'camera2', 'camera3']
        Ncams: 4
    m8:
      sensor_type: &sensor_type_m8 'camera'
      core_method: &core_method_m8 "BEVFormer"

      grid_conf: &grid_conf_m8
        xbound: [-51.2, 51.2, 0.4]   # Limit the range of the x direction and divide the grids
        ybound: [-51.2, 51.2, 0.4]   # Limit the range of the y direction and divide the grids
        zbound: [-10, 10, 20.0]   # Limit the range of the z direction and divide the grids
        ddiscr: [2, 50, 48]
        mode: 'LID'
      data_aug_conf: &data_aug_conf_m8
        resize_lim: [0.65, 0.7]
        final_dim: [384, 512]
        rot_lim: [-3.6, 3.6]
        H: 600
        W: 800
        rand_flip: False
        bot_pct_lim: [0.0, 0.0]
        cams: ['camera0', 'camera1', 'camera2', 'camera3']
        Ncams: 4
    m10:
      sensor_type: &sensor_type_m10 'lidar_camera'
      core_method: &core_method_m10 "BEVFusion"
      grid_conf: &grid_conf_m10
        xbound: [-51.2, 51.2, 0.4]   # Limit the range of the x direction and divide the grids
        ybound: [-51.2, 51.2, 0.4]   # Limit the range of the y direction and divide the grids
        zbound: [-10, 10, 20.0]   # Limit the range of the z direction and divide the grids
        ddiscr: [2, 50, 48]
        mode: 'LID'
      data_aug_conf: &data_aug_conf_m10
        resize_lim: [0.65, 0.7]
        final_dim: [384, 512]
        rot_lim: [-3.6, 3.6]
        H: 600
        W: 800
        rand_flip: False
        bot_pct_lim: [0.0, 0.05]
        cams: ['camera0', 'camera1', 'camera2', 'camera3']
        Ncams: 4
      # lidar requires preprocess
      preprocess:
        # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
        core_method: 'SpVoxelPreprocessor'
        args:
          voxel_size: &voxel_size_m10 [0.4, 0.4, 4]
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        # lidar range for each individual cav.
        cav_lidar_range: &cav_lidar_m10 [-51.2, -51.2, -3, 51.2, 51.2, 1]

# model related
model:
  args:
    m1:
      model_path: '/GPFS/data/changxingliu/HEAL/opencood/logs/_refine/single_group_formation/m1_16_fixenc_aligner_fixback_2025_10_27_21_31_53/net_epoch_bestval_at42.pth'
      core_method: *core_method_m1
      sensor_type: *sensor_type_m1
      lidar_range: *cav_lidar
      encoder_args:
        voxel_size: *voxel_size_m1
        lidar_range: *cav_lidar
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64
      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
      aligner_args:
        core_method: identity

    m2:
      model_path: '/GPFS/data/changxingliu/HEAL/opencood/logs/_refine/single_group_formation/m2_16_fixenc_aligner_fixback_2025_11_02_23_45_58/net_epoch_bestval_at42.pth'
      core_method: *core_method_m2
      sensor_type: *sensor_type_m2
      lidar_range: *cav_lidar
      encoder_args:
        voxel_size: *voxel_size_m2
        lidar_range: *cav_lidar
        mean_vfe:
          num_point_features: 4
        spconv:
          num_features_in: 4
          num_features_out: 64
        map2bev:
          feature_num: 128
      backbone_args:
        layer_nums: [3]
        layer_strides: [1] # Note here for Second, this is set to be 1 not 2.
        num_filters: [64]
        inplanes: 128
      aligner_args:
        core_method: identity

    m3:
      model_path: '/GPFS/data/changxingliu/HEAL/opencood/logs/_refine/single_group_formation/m3_16_fixenc_aligner_fixback_2025_11_02_23_49_56/net_epoch_bestval_at40.pth'
      core_method: *core_method_m3
      sensor_type: *sensor_type_m3
      lidar_range: *cav_lidar
      encoder_args:
        voxel_size: *voxel_size_m3
        lidar_range: *cav_lidar
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64
      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
      aligner_args:
        core_method: identity

    m4:
      model_path: ''
      core_method: *core_method_m4
      sensor_type: *sensor_type_m4
      encoder_args:
        voxel_size: *voxel_size_m4
        lidar_range: *cav_lidar
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64
      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
      aligner_args:
        core_method: identity
    m5:
      model_path: ''
      core_method: *core_method_m5
      sensor_type: *sensor_type_m5
      encoder_args:
        voxel_size: *voxel_size_m5
        lidar_range: *cav_lidar
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters: [64]
        point_pillar_scatter:
          num_features: 64
      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
      aligner_args:
        core_method: identity
    m6:
      model_path: '/GPFS/data/changxingliu/HEAL/opencood/logs/homo_codebook/m6_16/net_epoch_bestval_at28.pth'
      core_method: *core_method_m6
      sensor_type: *sensor_type_m6
      lidar_range: &cav_lidar_m6 [-51.2, -51.2, -3, 51.2, 51.2, 1]  # Needs to define here, because camera does not have lidar_range defined in preprocessing. But we need this information to crop feature
      encoder_args:
        anchor_number: *anchor_num
        grid_conf: *grid_conf_m6
        data_aug_conf: *data_aug_conf_m6
        img_downsample: 8
        img_features:  128
        use_depth_gt: false
        depth_supervision: true
        camera_encoder: Resnet101
      camera_mask_args:
        cav_lidar_range: *cav_lidar_m6
        grid_conf: *grid_conf_m6
      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
        inplanes: 128
  
      aligner_args:
        core_method: identity
    m7:
      model_path: '/GPFS/data/changxingliu/HEAL/opencood/logs/homo_codebook/m7_16/net_epoch_bestval_at27.pth'
      core_method: *core_method_m7
      sensor_type: *sensor_type_m7
      lidar_range: &cav_lidar_m7 [-51.2, -51.2, -3, 51.2, 51.2, 1] # Needs to define here, because camera does not have lidar_range defined in preprocessing. But we need this information to crop feature
      encoder_args:
        anchor_number: *anchor_num
        grid_conf: *grid_conf_m7
        data_aug_conf: *data_aug_conf_m7
        img_downsample: 8
        img_features:  128
        use_depth_gt: false
        depth_supervision: true
        camera_encoder: EfficientNet
      camera_mask_args:
        cav_lidar_range: *cav_lidar_m7
        grid_conf: *grid_conf_m7
      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]
        inplanes: 128
      aligner_args:
        core_method: identity
    m8:
      model_path: ''
      core_method: *core_method_m8
      sensor_type: *sensor_type_m8
      lidar_range: &cav_lidar_m8 [-51.2, -51.2, -3, 51.2, 51.2, 1] # Needs to define here, because camera does not have lidar_range defined in preprocessing. But we need this information to crop feature
      encoder_args:
        type: 'BEVFormerHead'
        bev_h: &bev_h_ 256
        bev_w: &bev_w_ 256
        num_query: 900
        num_classes: 10
        in_channels: &_dim_ 256
        sync_cls_avg_factor: True
        transformer: 
            rotate_prev_bev: True
            use_shift: True
            use_can_bus: True
            num_cams: 4
            embed_dims: *_dim_
            encoder: 
                type: 'BEVFormerEncoder'
                num_layers: 4
                pc_range: *cav_lidar
                num_points_in_pillar: 4
                return_intermediate: False
                transformerlayers: 
                    type: 'BEVFormerLayer'
                    attn_cfgs: 
                            - type: 'TemporalSelfAttention'
                              embed_dims: *_dim_
                              num_levels: 1
                            - type: 'SpatialCrossAttention'
                              num_cams: 4
                              pc_range: *cav_lidar
                              deformable_attention: 
                                  type: 'MSDeformableAttention3D'
                                  embed_dims: *_dim_
                                  num_points: 8
                                  num_levels: 1
                              embed_dims: *_dim_
                    feedforward_channels: 512
                    ffn_dropout: 0.1
                    operation_order:
                        - 'self_attn'
                        - 'norm'
                        - 'cross_attn'
                        - 'norm'
                        - 'ffn'
                        - 'norm'
        positional_encoding: 
            num_feats: *_dim_
            row_num_embed: *bev_h_
            col_num_embed: *bev_w_
      camera_mask_args:
        cav_lidar_range: *cav_lidar_m8
        grid_conf: *grid_conf_m8

      backbone_args:
        layer_nums: [1]
        layer_strides: [2]
        num_filters: [64]
        inplanes: *_dim_
  
      aligner_args:
        core_method: identity

    m10:
      core_method: *core_method_m10
      sensor_type: *sensor_type_m10
      lidar_range: *cav_lidar_m10
      encoder_args:
        encoder_args_lidar:
          voxel_size: *voxel_size_m10
          lidar_range: *cav_lidar_m10
          pillar_vfe:
            use_norm: true
            with_distance: false
            use_absolute_xyz: true
            num_filters: [64]
          point_pillar_scatter:
            num_features: 64
        encoder_args_cam:
          anchor_number: *anchor_num
          grid_conf: *grid_conf_m10
          data_aug_conf: *data_aug_conf_m10
          img_downsample: 8
          img_features: 128
          use_depth_gt: false
          depth_supervision: true
          camera_encoder: Resnet101
        fuser:
          in_channels: [64, 128]
          out_channels: 64
      camera_mask_args:
        cav_lidar_range: *cav_lidar_m10
        grid_conf: *grid_conf_m10
      backbone_args:
        layer_nums: [3]
        layer_strides: [2]
        num_filters: [64]