add_data_extension:
- bev_visibility.png
cav_lidar_range: &id003
- -102.4
- -102.4
- -3
- 102.4
- 102.4
- 1
comm_range: 70
fusion:
  args:
    data_aug_conf: None
    grid_conf: None
    proj_first: false
  core_method: intermediateheter
  dataset: opv2v
heter:
  assignment_path: opv2v_4modality.json
  definition_path: modality_define.yaml
  ego_modality: &id002
  - m7
  - m2
  - m1
  heter_group:
  - - m7
  lidar_channels_dict:
    m4: 32
  mapping_dict:
    m1: m1
    m2: m7
    m3: m2
    m4: m4
    m5: m5
    m6: m6
    m7: m7
    m8: m8
    m9: m9
input_source:
- lidar
- camera
- depth
label_type: lidar
loss:
  args:
    cls:
      alpha: 0.25
      gamma: 2.0
      type: SigmoidFocalLoss
      weight: 1.0
    depth:
      weight: 1.0
    dir:
      args: &id001
        anchor_yaw: &id005
        - 0
        - 90
        dir_offset: 0.7853
        num_bins: 2
      type: WeightedSoftmaxClassificationLoss
      weight: 0.2
    pos_cls_weight: 2.0
    pyramid:
      relative_downsample:
      - 1
      - 2
      - 4
      weight:
      - 0.4
      - 0.2
      - 0.1
    reg:
      codewise: true
      sigma: 3.0
      type: WeightedSmoothL1Loss
      weight: 2.0
  core_method: point_pillar_pyramid_loss
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 10
  - 20
model:
  args:
    aligner:
      args:
        dim: 64
        num_of_blocks: 4
      core_method: resnet3x3
    aligner_model:
      m1: weights/codespace_m1_epoch42.pth
    anchor_number: 2
    backend:
      m1: weights/codespace_m1_epoch42.pth
    backend_modality: &id004
    - m1
    codebook:
      dict_size: 16
      r: 1
      seg_num: 1
    dir_args: *id001
    ego_modality: *id002
    fusion:
      backbone:
        anchor_number: 2
        layer_nums:
        - 3
        - 5
        - 8
        layer_strides:
        - 1
        - 2
        - 2
        num_filters:
        - 64
        - 128
        - 256
        num_upsample_filter:
        - 128
        - 128
        - 128
        resnext: true
        upsample_strides:
        - 1
        - 2
        - 4
      method: pyramidfusion
      shrink_head:
        dim:
        - 256
        input_dim: 384
        kernal_size:
        - 3
        padding:
        - 1
        stride:
        - 1
    in_head: 256
    in_head_single: 64
    lidar_range: *id003
    only_train_translator: true
    out_size_factor: 2
    supervise_single: true
    translator:
      args:
        in_cav_lidar_range: *id003
        in_channels: 64
        in_feature_shape:
        - 256
        - 256
        out_cav_lidar_range: *id003
        out_channels: 16
        out_feature_shape:
        - 256
        - 256
        submodule_args:
          dim: 64
          embedding_dim: 64
          modality_map: *id004
          num_of_blocks: 3
      core_method: convnext
    use_coded_feature: false
    use_codemap: false
    use_d2d: false
    voxel_size: &id006
    - 0.4
    - 0.4
    - 4
  core_method: heter_codebook_shared_head_c2c
name: example/opv2v_m1_m7
optimizer:
  args:
    eps: 1.0e-10
    weight_decay: 0.0001
  core_method: Adam
  lr: 0.001
postprocess:
  anchor_args:
    D: 1
    H: 512
    W: 512
    cav_lidar_range: *id003
    feature_stride: 2
    h: 1.56
    l: 3.9
    num: 2
    r: *id005
    vd: 4
    vh: 0.4
    vw: 0.4
    w: 1.6
  cav_lidar_range: *id003
  core_method: VoxelPostprocessor
  dir_args: *id001
  gt_range: *id003
  max_num: 150
  nms_thresh: 0.15
  order: hwl
  target_args:
    neg_threshold: 0.45
    pos_threshold: 0.6
    score_threshold: 0.2
  voxel_size: *id006
preprocess:
  args:
    max_points_per_voxel: 1
    max_voxel_test: 1
    max_voxel_train: 1
    voxel_size: *id006
  cav_lidar_range: *id003
  core_method: SpVoxelPreprocessor
root_dir: ${OPV2V_ROOT}/train
test_dir: ${OPV2V_ROOT}/test
train_params:
  batch_size: 1
  epoches: 30
  eval_freq: 2
  max_cav: 5
  save_freq: 5
validate_dir: ${OPV2V_ROOT}/validate
yaml_parser: load_general_params_heter_group
