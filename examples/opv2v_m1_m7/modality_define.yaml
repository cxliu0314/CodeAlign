cav_lidar_range: &id001
- -102.4
- -102.4
- -3
- 102.4
- 102.4
- 1
anchor_num: 2
heter:
  modality_setting:
    m1:
      sensor_type: lidar
      core_method: point_pillar
      preprocess:
        core_method: SpVoxelPreprocessor
        args:
          voxel_size: &id002
          - 0.4
          - 0.4
          - 4
          max_points_per_voxel: 32
          max_voxel_train: 32000
          max_voxel_test: 70000
        cav_lidar_range: *id001
    m2:
      sensor_type: lidar
      core_method: second
      preprocess:
        core_method: SpVoxelPreprocessor
        args:
          voxel_size: &id003
          - 0.1
          - 0.1
          - 0.1
          max_points_per_voxel: 5
          max_voxel_train: 32000
          max_voxel_test: 70000
        cav_lidar_range: *id001
    m7:
      sensor_type: camera
      core_method: lift_splat_shoot
      grid_conf: &id004
        xbound:
        - -51.2
        - 51.2
        - 0.4
        ybound:
        - -51.2
        - 51.2
        - 0.4
        zbound:
        - -10
        - 10
        - 20.0
        ddiscr:
        - 2
        - 50
        - 48
        mode: LID
      data_aug_conf: &id005
        resize_lim:
        - 0.65
        - 0.7
        final_dim:
        - 384
        - 512
        rot_lim:
        - -3.6
        - 3.6
        H: 600
        W: 800
        rand_flip: false
        bot_pct_lim:
        - 0.0
        - 0.05
        cams:
        - camera0
        - camera1
        - camera2
        - camera3
        Ncams: 4
model:
  args:
    m1:
      model_path: weights/encoder_m1_epoch40.pth
      core_method: point_pillar
      sensor_type: lidar
      lidar_range: *id001
      encoder_args:
        voxel_size: *id002
        lidar_range: *id001
        pillar_vfe:
          use_norm: true
          with_distance: false
          use_absolute_xyz: true
          num_filters:
          - 64
        point_pillar_scatter:
          num_features: 64
      backbone_args:
        layer_nums:
        - 3
        layer_strides:
        - 2
        num_filters:
        - 64
      aligner_args:
        core_method: identity
    m2:
      model_path: weights/encoder_m2_epoch42.pth
      core_method: second
      sensor_type: lidar
      lidar_range: *id001
      encoder_args:
        voxel_size: *id003
        lidar_range: *id001
        mean_vfe:
          num_point_features: 4
        spconv:
          num_features_in: 4
          num_features_out: 64
        map2bev:
          feature_num: 128
      backbone_args:
        layer_nums:
        - 3
        layer_strides:
        - 1
        num_filters:
        - 64
        inplanes: 128
      aligner_args:
        core_method: identity
    m7:
      model_path: weights/encoder_m7_epoch18.pth
      core_method: lift_splat_shoot
      sensor_type: camera
      lidar_range: &id006
      - -51.2
      - -51.2
      - -3
      - 51.2
      - 51.2
      - 1
      encoder_args:
        anchor_number: 2
        grid_conf: *id004
        data_aug_conf: *id005
        img_downsample: 8
        img_features: 128
        use_depth_gt: false
        depth_supervision: true
        camera_encoder: EfficientNet
        pretrained: false
      camera_mask_args:
        cav_lidar_range: *id006
        grid_conf: *id004
      backbone_args:
        layer_nums:
        - 3
        layer_strides:
        - 2
        num_filters:
        - 64
        inplanes: 128
      aligner_args:
        core_method: identity
